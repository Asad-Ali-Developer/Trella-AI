services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: client-insights-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-client_insights}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d client_insights"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: client-insights-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: client-insights-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client-insights-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - APP_ENV=development
      - DEBUG=true
      - PORT=8000
      - HOST=0.0.0.0
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=client_insights
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/client_insights
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@client-insights.local}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - PASSWORD_RESET_TOKEN_EXPIRE_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_API_BASE_URL=${MAILGUN_API_BASE_URL:-https://api.mailgun.net/v3}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL:-}
      - SECRET_KEY=${SECRET_KEY:-temporary_dev_secret_key_minimum_32_chars_long}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dGhpc19pc19hXzMyX2J5dGVfZXhhbXBsZV9rZXlfMTI=}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - TRELLO_API_BASE_URL=${TRELLO_API_BASE_URL:-https://api.trello.com/1}
      - TRELLO_API_KEY=${TRELLO_API_KEY:-}
      - TRELLO_WEBHOOK_CALLBACK_URL=${TRELLO_WEBHOOK_CALLBACK_URL:-}
      - TRELLO_WEBHOOK_SECRET=${TRELLO_WEBHOOK_SECRET:-}
      - TRELLO_TOKEN_RETURN_URL=${TRELLO_TOKEN_RETURN_URL:-http://localhost:3000/dashboard/trello/callback}
      - TRELLO_TOKEN_SCOPE=${TRELLO_TOKEN_SCOPE:-read}
      - TRELLO_TOKEN_EXPIRATION=${TRELLO_TOKEN_EXPIRATION:-never}
      - TRELLO_OAUTH_CLIENT_ID=${TRELLO_OAUTH_CLIENT_ID:-}
      - TRELLO_OAUTH_CLIENT_SECRET=${TRELLO_OAUTH_CLIENT_SECRET:-}
      - TRELLO_OAUTH_CALLBACK_URL=${TRELLO_OAUTH_CALLBACK_URL:-http://localhost:3000/dashboard/trello/callback}
      - TRELLO_OAUTH_SCOPES=${TRELLO_OAUTH_SCOPES:-read:board:trello read:organization:trello read:member:trello offline_access}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - ENCRYPTION_FALLBACK_KEYS=${ENCRYPTION_FALLBACK_KEYS:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: client-insights-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app worker --loglevel=INFO
    environment:
      - APP_ENV=development
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/client_insights
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_BASE_URL=${FRONTEND_BASE_URL:-http://localhost:3000}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-no-reply@client-insights.local}
      - SMTP_STARTTLS=${SMTP_STARTTLS:-false}
      - SMTP_USE_SSL=${SMTP_USE_SSL:-false}
      - PASSWORD_RESET_TOKEN_EXPIRE_MINUTES=${PASSWORD_RESET_TOKEN_EXPIRE_MINUTES:-30}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY:-}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN:-}
      - MAILGUN_API_BASE_URL=${MAILGUN_API_BASE_URL:-https://api.mailgun.net/v3}
      - MAILGUN_FROM_EMAIL=${MAILGUN_FROM_EMAIL:-}
      - TRELLO_API_BASE_URL=${TRELLO_API_BASE_URL:-https://api.trello.com/1}
      - TRELLO_API_KEY=${TRELLO_API_KEY:-}
      - TRELLO_WEBHOOK_CALLBACK_URL=${TRELLO_WEBHOOK_CALLBACK_URL:-}
      - TRELLO_WEBHOOK_SECRET=${TRELLO_WEBHOOK_SECRET:-}
      - TRELLO_OAUTH_CLIENT_ID=${TRELLO_OAUTH_CLIENT_ID:-}
      - TRELLO_OAUTH_CLIENT_SECRET=${TRELLO_OAUTH_CLIENT_SECRET:-}
      - SECRET_KEY=${SECRET_KEY:-temporary_dev_secret_key_minimum_32_chars_long}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dGhpc19pc19hXzMyX2J5dGVfZXhhbXBsZV9rZXlfMTI=}
      - ENCRYPTION_FALLBACK_KEYS=${ENCRYPTION_FALLBACK_KEYS:-}
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: client-insights-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_APP_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
