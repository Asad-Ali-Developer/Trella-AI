services:
  redis:
    image: redis:7-alpine
    container_name: trella-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trella-api
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trella-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app worker --loglevel=INFO --concurrency=2 -Q critical,sync,ai,delivery
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trella-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app:celery_app beat --loglevel=INFO
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - DEBUG=false
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy

  caddy:
    image: caddy:alpine
    container_name: trella-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  redis_data:
  caddy_data:
  caddy_config:

