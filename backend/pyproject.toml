[project]
name = "client-insights-api"
version = "0.1.0"
description = "Client Insights API - Trello + AI Platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pgvector>=0.3.6",
    "celery[redis]>=5.4.0",
    "jinja2>=3.1.4",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "email-validator>=2.2.0",
    "sentry-sdk[fastapi]>=2.13.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "respx>=0.21.1",
    "pre-commit>=3.7.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
include = ["app/templates/email/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",                              # pycodestyle errors
    "W",                              # pycodestyle warnings
    "F",                              # pyflakes
    "I",                              # isort
    "B",                              # flake8-bugbear
    "C4",                             # flake8-comprehensions
    "UP",                             # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (Fastapi Depends)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "celery.*",
    "respx.*",
    "structlog.*",
    "sentry_sdk.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.workers.tasks"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "7.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
